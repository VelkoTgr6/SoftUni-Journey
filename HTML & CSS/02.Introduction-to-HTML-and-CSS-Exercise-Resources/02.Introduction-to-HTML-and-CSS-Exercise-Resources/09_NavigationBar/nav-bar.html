<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <link rel="stylesheet" href="nav-bar.css">
    <style>
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            display: inline-block;
        }
    </style>  
</head>
<body>
    
    <main>
        <ul>
            <nav>
                <strong>
                <li><a>Home</a></li>
                <li><a>Tutorials</a></li>
                <li><a>About</a></li>
                <li><a>Contact</a></li>
                <li><a>Newsletter</a></li>
                </strong>
            </nav>
        </ul>
    </main>
    
</body>
</html>
