<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Normal Buttons</h2>
    <section class="normal">
        <button>
            <a>Learn More</a>
        </button>
        <button>Learn More</button>
        <button class="hover">Learn More</button>
    </section>

    <h2>Filled Buttons</h2>
    <section class="filled">
        <button class="fill"><a>Learn More</a></button>
        <button class="fill">Learn More</button>
        <button class="fill hover">Learn More</button>
    </section>

    <h2>Icon Buttons</h2>
    <button class="fill"><a>Download</a></button>
    <button class="fill">Download</button>
    <button class="fill hover">Download</button>

</body>
</html>
